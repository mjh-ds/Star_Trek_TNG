description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Holt", email = "mjholt02@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipywidgets>=8.1.9",
    "kagglehub>=1.0.2",
    "keyring>=25.7.0",
    "pandas>=3.0.5",
